<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Charity fun run at sunrise">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1055"/><stop offset="45%" stop-color="#7b2d6b"/>
      <stop offset="75%" stop-color="#e2603f"/><stop offset="100%" stop-color="#ffb457"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b3a63"/><stop offset="100%" stop-color="#241a33"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0%" stop-color="#ffe08a" stop-opacity=".95"/><stop offset="100%" stop-color="#ffb457" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="400" height="260" fill="url(#sky)"/>
  <circle cx="300" cy="86" r="62" fill="url(#glow)"/>
  <circle cx="300" cy="86" r="30" fill="#ffd884"/>
  <g fill="#fff" opacity=".8">
    <circle cx="48" cy="34" r="1.7"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="20" r="1.3"><animate attributeName="opacity" values="1;.25;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="196" cy="40" r="1.5"><animate attributeName="opacity" values=".4;1;.4" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- distant hills -->
  <path d="M0 168 L60 128 L112 162 L168 118 L232 164 L300 126 L360 160 L400 140 L400 260 L0 260 Z" fill="#3b1f4e" opacity=".85"/>
  <path d="M0 192 L70 164 L140 190 L210 158 L286 188 L360 162 L400 182 L400 260 L0 260 Z" fill="#251338"/>

  <!-- road -->
  <path d="M0 214 L400 196 L400 260 L0 260 Z" fill="url(#road)"/>
  <g stroke="#ffd884" stroke-width="5" stroke-linecap="round" opacity=".85" stroke-dasharray="18 22">
    <path d="M-10 236 L410 218">
      <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- runners -->
  <g fill="#1b1024">
    <g transform="translate(96,150)">
      <animateTransform attributeName="transform" type="translate" values="96,150;100,144;96,150" dur="0.7s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="9"/>
      <path d="M-2 10 q10 6 16 2 l7 20 -6 3 -7 -14 -6 22 -6 -2 4 -22 -8 -6 z"/>
      <path d="M2 12 l14 14" stroke="#1b1024" stroke-width="5" fill="none"/>
    </g>
    <g transform="translate(170,158)" opacity=".9">
      <animateTransform attributeName="transform" type="translate" values="170,158;174,152;170,158" dur="0.62s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="8"/>
      <path d="M-2 9 q9 5 15 2 l6 19 -6 3 -6 -13 -6 21 -6 -2 4 -21 -7 -6 z"/>
    </g>
    <g transform="translate(240,164)" opacity=".75">
      <animateTransform attributeName="transform" type="translate" values="240,164;244,158;240,164" dur="0.8s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="7"/>
      <path d="M-2 8 q8 5 13 2 l6 17 -5 3 -6 -12 -5 19 -6 -2 4 -19 -6 -5 z"/>
    </g>
  </g>

  <!-- bunting -->
  <g>
    <path d="M20 44 Q110 74 200 46 Q290 74 380 44" stroke="#ffd884" stroke-width="2" fill="none" opacity=".7"/>
    <g fill="#ff8a5b">
      <path d="M56 56 l12 0 l-6 12 z"><animate attributeName="opacity" values="1;.5;1" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M96 62 l12 0 l-6 12 z" fill="#ffd884"><animate attributeName="opacity" values=".5;1;.5" dur="1.9s" repeatCount="indefinite"/></path>
      <path d="M136 64 l12 0 l-6 12 z"><animate attributeName="opacity" values="1;.45;1" dur="1.4s" repeatCount="indefinite"/></path>
      <path d="M300 60 l12 0 l-6 12 z" fill="#ffd884"><animate attributeName="opacity" values=".5;1;.5" dur="1.7s" repeatCount="indefinite"/></path>
      <path d="M340 52 l12 0 l-6 12 z"><animate attributeName="opacity" values="1;.5;1" dur="1.5s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <!-- hearts floating -->
  <g fill="#ff7a8a">
    <path d="M330 118 c-4-6-12-2-12 5 c0 7 9 11 12 15 c3-4 12-8 12-15 c0-7-8-11-12-5 z" opacity=".85">
      <animate attributeName="transform" values="translate(0,0);translate(-8,-34)" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M278 126 c-3-5-9-1-9 4 c0 5 7 8 9 11 c2-3 9-6 9-11 c0-6-6-9-9-4 z" opacity=".7">
      <animate attributeName="transform" values="translate(0,0);translate(6,-40)" dur="4.2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;0" dur="4.2s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
