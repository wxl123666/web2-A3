<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Charity silent auction">
  <defs>
    <linearGradient id="gal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b2410"/><stop offset="50%" stop-color="#6b4218"/>
      <stop offset="100%" stop-color="#2a1a0c"/>
    </linearGradient>
    <radialGradient id="spot"><stop offset="0%" stop-color="#ffd9a0" stop-opacity=".55"/><stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="260" fill="url(#gal)"/>
  <ellipse cx="200" cy="120" rx="150" ry="110" fill="url(#spot)"/>

  <!-- gallery wall panels -->
  <g>
    <g transform="translate(60,58)">
      <rect x="0" y="0" width="86" height="66" rx="4" fill="#1d1207" stroke="#c98b3f" stroke-width="3"/>
      <path d="M8 52 l18 -26 l14 18 l10 -12 l20 20 z" fill="#f0a95c"/>
      <circle cx="66" cy="18" r="7" fill="#ffe1a8"/>
    </g>
    <g transform="translate(168,44)">
      <rect x="0" y="0" width="66" height="80" rx="4" fill="#1d1207" stroke="#c98b3f" stroke-width="3"/>
      <circle cx="33" cy="30" r="15" fill="#e0714f"/>
      <path d="M10 62 q23 -30 46 0 z" fill="#7fbf8f"/>
    </g>
    <g transform="translate(258,60)">
      <rect x="0" y="0" width="82" height="62" rx="4" fill="#1d1207" stroke="#c98b3f" stroke-width="3"/>
      <path d="M10 48 q20 -34 30 -6 q10 -22 30 6 z" fill="#8a6fd6"/>
      <circle cx="24" cy="16" r="6" fill="#ffe1a8"/>
    </g>
  </g>

  <!-- floor -->
  <rect x="0" y="200" width="400" height="60" fill="#1a1006"/>
  <path d="M0 200 h400 v8 H0 z" fill="#43290f"/>

  <!-- auction podium -->
  <g transform="translate(158,168)">
    <path d="M0 0 L84 0 L74 34 L10 34 Z" fill="#a9702f"/>
    <rect x="6" y="-6" width="72" height="8" rx="3" fill="#e0a15c"/>
    <!-- gavel -->
    <g transform="translate(42,-30)">
      <animateTransform attributeName="transform" type="rotate" values="0 0 14; -22 0 14; 0 0 14; -14 0 14; 0 0 14" dur="2.4s" repeatCount="indefinite"/>
      <rect x="-16" y="-6" width="32" height="11" rx="5" fill="#c98b3f"/>
      <rect x="-3" y="3" width="6" height="20" rx="3" fill="#8a5a22"/>
    </g>
    <rect x="26" y="-22" width="32" height="7" rx="3" fill="#f0d3a1"/>
  </g>

  <!-- bidding paddles -->
  <g>
    <g transform="translate(288,150)">
      <animateTransform attributeName="transform" type="translate" values="288,150;288,138;288,150" dur="2.6s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="22" height="26" rx="4" fill="#f4e3c2"/>
      <text x="11" y="18" font-family="Arial" font-size="14" font-weight="bold" fill="#8a5a22" text-anchor="middle">7</text>
      <rect x="9" y="26" width="4" height="26" rx="2" fill="#8a5a22"/>
    </g>
    <g transform="translate(96,158)">
      <animateTransform attributeName="transform" type="translate" values="96,158;96,146;96,158" dur="3.1s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="22" height="26" rx="4" fill="#f4e3c2"/>
      <text x="11" y="18" font-family="Arial" font-size="14" font-weight="bold" fill="#8a5a22" text-anchor="middle">3</text>
      <rect x="9" y="26" width="4" height="26" rx="2" fill="#8a5a22"/>
    </g>
  </g>

  <!-- coins / sparkles -->
  <g fill="#ffd884">
    <circle cx="52" cy="176" r="5"><animate attributeName="cy" values="176;150" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="356" cy="188" r="4"><animate attributeName="cy" values="188;158" dur="3.6s" begin=".9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin=".9s" repeatCount="indefinite"/></circle>
  </g>
</svg>
