<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Charity gala dinner">
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b0f36"/><stop offset="55%" stop-color="#3a1f63"/>
      <stop offset="100%" stop-color="#160c2b"/>
    </linearGradient>
    <radialGradient id="chand"><stop offset="0%" stop-color="#ffe9b0" stop-opacity=".9"/><stop offset="100%" stop-color="#ffbf5c" stop-opacity="0"/></radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e6ff"/><stop offset="100%" stop-color="#c9a9f0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="260" fill="url(#hall)"/>

  <!-- starry backdrop -->
  <g fill="#fff">
    <circle cx="40" cy="30" r="1.5" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="46" r="1.6" opacity=".6"><animate attributeName="opacity" values=".9;.2;.9" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="22" r="1.2" opacity=".5"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="92" cy="62" r="1.2" opacity=".5"><animate attributeName="opacity" values="1;.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- chandelier -->
  <g transform="translate(200,26)">
    <animateTransform attributeName="transform" type="translate" values="200,26;200,30;200,26" dur="5s" repeatCount="indefinite"/>
    <circle cx="0" cy="18" r="34" fill="url(#chand)" opacity=".55"/>
    <path d="M0 0 L0 14" stroke="#f6d98a" stroke-width="2"/>
    <path d="M-26 24 q26 -16 52 0 l-6 10 q-20 -10 -40 0 z" fill="#ffd884" opacity=".95"/>
    <g fill="#fff3c4">
      <circle cx="-20" cy="34" r="3.4"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="-7" cy="38" r="3.4"><animate attributeName="opacity" values=".4;1;.4" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="7" cy="38" r="3.4"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="20" cy="34" r="3.4"><animate attributeName="opacity" values=".35;1;.35" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- guests silhouettes -->
  <g fill="#120a24" opacity=".9">
    <g transform="translate(72,150)"><circle cx="0" cy="0" r="11"/><path d="M-14 14 q14 -8 28 0 l4 40 -36 0 z"/></g>
    <g transform="translate(132,158)"><circle cx="0" cy="0" r="10"/><path d="M-13 13 q13 -8 26 0 l4 36 -34 0 z"/></g>
    <g transform="translate(268,158)"><circle cx="0" cy="0" r="10"/><path d="M-13 13 q13 -8 26 0 l4 36 -34 0 z"/></g>
    <g transform="translate(328,150)"><circle cx="0" cy="0" r="11"/><path d="M-14 14 q14 -8 28 0 l4 40 -36 0 z"/></g>
  </g>

  <!-- banquet table -->
  <rect x="40" y="196" width="320" height="12" rx="6" fill="url(#cloth)"/>
  <rect x="46" y="208" width="308" height="52" fill="#2a1650"/>
  <path d="M46 208 h308 v10 q-154 12 -308 0 z" fill="#3d2270" opacity=".7"/>

  <!-- candles + glasses -->
  <g>
    <g transform="translate(110,196)">
      <rect x="-4" y="-26" width="8" height="26" rx="3" fill="#fff6dd"/>
      <ellipse cx="0" cy="-30" rx="4.5" ry="7" fill="#ffcf6b">
        <animate attributeName="ry" values="7;9;6;8;7" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="-30;-32;-29;-31;-30" dur="1.1s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g transform="translate(290,196)">
      <rect x="-4" y="-26" width="8" height="26" rx="3" fill="#fff6dd"/>
      <ellipse cx="0" cy="-30" rx="4.5" ry="7" fill="#ffcf6b">
        <animate attributeName="ry" values="6;9;7;8;6" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="-30;-32;-29;-31;-30" dur="1.4s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <!-- champagne glasses -->
    <g transform="translate(196,192)" stroke="#ffe9b0" stroke-width="2.4" fill="none">
      <path d="M-13 -18 l13 20 l13 -20 z" fill="#ffe9b0" fill-opacity=".35"/>
      <path d="M0 2 L0 14 M-8 14 L8 14"/>
      <animateTransform attributeName="transform" type="translate" values="196,192;196,188;196,192" dur="3.6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(232,192)" stroke="#ffe9b0" stroke-width="2.4" fill="none">
      <path d="M-13 -18 l13 20 l13 -20 z" fill="#ffe9b0" fill-opacity=".35"/>
      <path d="M0 2 L0 14 M-8 14 L8 14"/>
      <animateTransform attributeName="transform" type="translate" values="232,192;232,187;232,192" dur="4.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- confetti sparkles -->
  <g fill="#ffd884" opacity=".85">
    <rect x="60" y="80" width="4" height="4" rx="1" transform="rotate(20 62 82)">
      <animate attributeName="y" values="70;40" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="336" y="90" width="4" height="4" rx="1" transform="rotate(-25 338 92)">
      <animate attributeName="y" values="86;52" dur="4.4s" begin=".8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="4.4s" begin=".8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
